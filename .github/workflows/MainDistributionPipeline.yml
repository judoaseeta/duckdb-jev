#
# Builds, tests and (on a tag) releases the extension binaries through DuckDB's
# distribution pipeline.
#
name: Main Extension Distribution Pipeline
on:
  # A bare `push:` would run this whole pipeline a second time for every commit on a
  # branch that already has a pull request open, which queues behind itself on a
  # personal account's runners. Branches get their run from the pull_request event.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: jev
      # jev talks HTTPS from a thread pool, neither of which a WASM build has.
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: jev
      format_checks: 'format'

  mock-api-tests:
    name: Regression tests against the mock API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: sudo apt-get update -y -qq && sudo apt-get install -y -qq ninja-build libssl-dev

      - name: Build
        env:
          GEN: ninja
        run: make release

      - name: Run the suite with the mock API
        run: make test_mock
